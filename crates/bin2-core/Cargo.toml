[package]
name = "bin2-core"
description = "Seal any file into a self-contained, forever-openable .bin2 file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
